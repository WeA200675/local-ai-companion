[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-companion"
version = "0.2.0a0"
description = "Private-first local AI companion with persona state, reversible learning, and local media continuity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "PySide6>=6.8,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["app", "app.ai", "app.memory", "app.media", "app.ui"]
